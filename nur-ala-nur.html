@property --sh{syntax:"<number>";inherits:true;initial-value:0}

:root{
  --em:#123B2E; --em-deep:#0A2219; --em-lite:#1D5A45;
  --gold:#C6A565; --gold-d:#7A5C22; --gold-l:#E9D3A0;
  --parch:#F3E9D2; --ink:#26352C;
  --ff:"Amiri L","Amiri","Noto Naskh Arabic","Scheherazade New","Traditional Arabic","Geeza Pro","Segoe UI",serif;
  --ffq:"Amiri Quran L","Amiri Quran","Amiri L","Amiri","Noto Naskh Arabic",serif;
  --tex:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .45 0 0 0 0 .32 0 0 0 0 .12 0 0 0 .11 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  --lattice:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96' viewBox='0 0 96 96'><g fill='none' stroke='%23C6A565' stroke-opacity='.11' stroke-width='1'><rect x='28' y='28' width='40' height='40'/><rect x='28' y='28' width='40' height='40' transform='rotate(45 48 48)'/><circle cx='48' cy='48' r='9'/><path d='M0 0l12 12M96 0L84 12M0 96l12-12M96 96L84 84'/></g></svg>");
  --star:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'><path d='M10 0L12.9 4.1 17.1 2.9 15.9 7.1 20 10 15.9 12.9 17.1 17.1 12.9 15.9 10 20 7.1 15.9 2.9 17.1 4.1 12.9 0 10 4.1 7.1 2.9 2.9 7.1 4.1Z' fill='%23C6A565'/></svg>");
  --foil:linear-gradient(135deg,#8f6b2e 0%,#e9d094 28%,#C6A565 52%,#f3e3b4 74%,#9a7433 100%);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--ff);color:var(--gold-l);overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 38%,var(--em-lite) 0%,var(--em) 42%,var(--em-deep) 100%);
  -webkit-font-smoothing:antialiased;
}
.bg-lattice{position:fixed;inset:0;background-image:var(--lattice);background-size:96px 96px;opacity:.9;pointer-events:none;
  -webkit-mask-image:radial-gradient(ellipse at 50% 45%,transparent 18%,#000 80%);mask-image:radial-gradient(ellipse at 50% 45%,transparent 18%,#000 80%)}
.particles{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.particles i{position:absolute;border-radius:50%;background:radial-gradient(circle,#f8e6ac 0%,#C6A565 55%,transparent 72%);opacity:0;animation:rise linear infinite}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}14%{opacity:.85}70%{opacity:.5}100%{transform:translate3d(14px,-62vh,0);opacity:0}}
.rm .particles{display:none}

button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-l);outline-offset:3px;border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- stage ---------- */
.stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top)) 0 118px;gap:clamp(8px,2vh,22px)}
.bism-top{margin:0;font-size:clamp(15px,2.4vh,22px);color:var(--gold);letter-spacing:0;transition:opacity .8s;text-shadow:0 0 18px rgba(198,165,101,.35)}
.st-open .bism-top{opacity:0}
.hint{margin:0;font-size:clamp(15px,2.3vh,20px);color:var(--gold-l);opacity:.78;transition:opacity .6s;animation:breathe 3.4s ease-in-out infinite}
.rm .hint{animation:none}
@keyframes breathe{50%{opacity:.4}}
.st-open .hint,.st-end .hint{opacity:0;animation:none;pointer-events:none}

.book-wrap{position:relative;transition:opacity .9s ease}
.st-end .book-wrap{opacity:0;pointer-events:none}
.book{position:relative;width:var(--bw,900px);height:var(--bh,600px);perspective:2600px;
  transition:transform var(--dur,.9s) cubic-bezier(.5,0,.2,1);--fs:17px}
.book.closed{transform:translateX(25%)}
.book.mob.closed{transform:none}
.board{position:absolute;top:-1.4%;bottom:-1.4%;left:-1.5%;right:-1.5%;border-radius:.9em;z-index:0;
  background:linear-gradient(160deg,#175441,#0d2e23);border:1px solid rgba(198,165,101,.55);
  box-shadow:0 2.2em 4em rgba(0,0,0,.55),inset 0 0 0 .35em #0d2e23,inset 0 0 0 calc(.35em + 1px) rgba(198,165,101,.4);
  transition:right var(--dur,.9s) cubic-bezier(.5,0,.2,1),left var(--dur,.9s) cubic-bezier(.5,0,.2,1)}
.book.closed .board{right:49%}
.book.mob .board{right:-1.5%;left:-1.5%}
.glow{position:absolute;left:50%;top:50%;width:90%;height:80%;transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;z-index:7;opacity:0;mix-blend-mode:screen;
  background:radial-gradient(ellipse,rgba(244,214,140,.5),rgba(244,214,140,0) 68%)}
.book.glowing .glow{animation:glow 2.4s ease-out}
@keyframes glow{0%{opacity:0}35%{opacity:.9}100%{opacity:0}}

/* ================= STATE ================= */
var $=function(id){return document.getElementById(id)};
var book=$("book"),wrap=$("bookWrap"),pgL=$("pgLeft"),pgR=$("pgRight"),leaf=$("leaf"),fF=$("faceFront"),fB=$("faceBack");
var mobile=false,S=-1,Pg=-1,busy=false,tscale=1,userRM=false;
var mqRM=window.matchMedia?window.matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
function reduced(){return userRM||mqRM.matches}

function Lh(sp){return sp<0?COVER:P[2*sp+1]}
function Rh(sp){return sp<0?'':P[2*sp]}
function cur(){return mobile?Pg:S}

function fit(root){
  if(mobile||tscale!==1||!root) return;
  var els=root.querySelectorAll(".inner");
  for(var i=0;i<els.length;i++){
    var el=els[i],k=1;el.style.fontSize="";
    while(el.scrollHeight>el.clientHeight+2&&k>0.7){k-=0.04;el.style.fontSize=k.toFixed(2)+"em"}
  }
}

function setState(name){
  document.body.className=document.body.className.replace(/\bst-\w+/g,"").trim()+" st-"+name;
}

function layout(){
  var vw=window.innerWidth,vh=window.innerHeight;
  var wasMobile=mobile;
  mobile=(vw<860)||(vh<480);
  if(wasMobile!==mobile){
    if(mobile){Pg=S<0?-1:2*S}else{S=Pg<0?-1:Math.floor(Pg/2)}
  }
  var bw,bh,fs;
  if(!mobile){
    bw=Math.min(1060,vw*0.94,(vh-190)*1.5);bw=Math.max(bw,520);bh=bw/1.5;fs=bw/54;
  }else{
    var w=Math.min(vw*0.94,520);
    bh=Math.min(vh-220,w*1.5);bh=Math.max(bh,300);
    bw=Math.min(w,bh/1.15);fs=Math.max(15,Math.min(22,bw/21));
  }
  document.documentElement.style.setProperty("--bw",bw+"px");
  document.documentElement.style.setProperty("--bh",bh+"px");
  book.style.setProperty("--fs",fs+"px");
  book.classList.toggle("mob",mobile);
}

function updateUI(){
  var c=cur(),open=c>=0;
  var si=mobile?(c<0?-1:Math.floor(c/2)):S;
  book.classList.toggle("closed",c<0);
  book.classList.toggle("cover-hover",c<0);
  wrap.setAttribute("role",c<0?"button":"group");
  wrap.setAttribute("tabindex",c<0?"0":"-1");
  wrap.setAttribute("aria-label",c<0?"الكتاب مغلق. المسي الكتاب ليفتح":"الكتاب مفتوح");
  if(document.body.className.indexOf("st-end")<0) setState(open?"open":"cover");
  var pct,txt;
  if(mobile){pct=Math.max(0,c)/(NP-1)*100;txt=open?("صفحة "+ar(c+1)+" من "+ar(NP)):""}
  else{pct=(S<0?0:(2*S+1)/(NP-1)*100);txt=open?("الصفحتان "+ar(2*S+1)+" – "+ar(2*S+2)+" من "+ar(NP)):""}
  $("progBar").style.width=Math.min(100,pct)+"%";
  $("progTxt").textContent=txt;
  $("btnPrev").disabled=!(open&&(mobile?Pg>0:S>0));
  var tb=document.querySelectorAll(".toc button");
  for(var i=0;i<tb.length;i++){tb[i].classList.toggle("cur",+tb[i].getAttribute("data-s")===si)}
  book.classList.toggle("reveal-on",si===8);
  if(open&&si>=0) $("live").textContent=CH[si];
}

function renderStatic(){
  if(mobile){
    pgL.innerHTML=Pg<0?COVER:P[Pg];pgR.innerHTML="";
    fit(pgL);
  }else{
    pgL.innerHTML=Lh(S);pgR.innerHTML=Rh(S);
    fit(pgL);fit(pgR);
  }
  updateUI();
}

/* ================= NAVIGATION ================= */
function canAnimate(){return !reduced()&&typeof leaf.animate==="function"}

function flip(from,to){
  if(from===to) return;
  if(!canAnimate()){S=to;renderStatic();return}
  busy=true;
  var fwd=to>from;
  var dur=(from===-1||to===-1)?2300:((from===8||to===8)?1700:1000);
  book.style.setProperty("--dur",dur+"ms");
  if(fwd){
    pgL.innerHTML=Lh(to);pgR.innerHTML=Rh(from);
    fF.innerHTML=Lh(from);fB.innerHTML=Rh(to);
  }else{
    pgL.innerHTML=Lh(from);pgR.innerHTML=Rh(to);
    fF.innerHTML=Lh(to);fB.innerHTML=Rh(from);
  }
  leaf.style.display="block";
  fit(pgL);fit(pgR);fit(fF);fit(fB);
  book.classList.toggle("closed",to<0);
  if(from<0) {book.classList.remove("glowing");void book.offsetWidth;book.classList.add("glowing")}
  if(to>=0&&document.body.className.indexOf("st-end")<0) setState("open");
  var a=fwd?[{transform:"rotateY(0deg)"},{transform:"rotateY(180deg)"}]:[{transform:"rotateY(180deg)"},{transform:"rotateY(0deg)"}];
  var anim=leaf.animate(a,{duration:dur,easing:"cubic-bezier(.45,.05,.25,1)",fill:"forwards"});
  try{leaf.animate([{"--sh":0},{"--sh":.55,offset:.5},{"--sh":0}],{duration:dur,easing:"linear"})}catch(e){}
  var done=function(){
    anim.cancel();leaf.style.display="none";
    S=to;busy=false;renderStatic();
  };
  anim.onfinish=done;
  anim.oncancel=function(){};
}

function mobileTo(p){
  var dir=p>Pg?1:-1;Pg=p;renderStatic();
  if(!reduced()&&pgL.animate){pgL.animate([{opacity:0,transform:"translateX("+(-22*dir)+"px)"},{opacity:1,transform:"none"}],{duration:300,easing:"ease-out"})}
}

function gotoSpread(t){
  if(busy) return;
  if(t>LAST){finish();return}
  t=Math.max(-1,t);
  if(mobile){var p=t<0?-1:2*t;if(p!==Pg) mobileTo(p);return}
  if(t!==S) flip(S,t);
}
function next(){
  if(busy) return;
  if(cur()<0){openBook();return}
  if(mobile){if(Pg>=NP-1){finish();return}mobileTo(Pg+1)}
  else gotoSpread(S+1);
}
function prev(){
  if(busy||cur()<0) return;
  if(mobile){if(Pg>0) mobileTo(Pg-1)}
  else if(S>0) gotoSpread(S-1);
}
function openBook(){
  if(busy||cur()>=0) return;
  if(!reduced()&&wrap.animate){
    wrap.animate([{transform:"translateY(0) scale(1)"},{transform:"translateY(5px) scale(.985)",offset:.45},{transform:"translateY(0) scale(1)"}],{duration:260,easing:"ease-out"});
    setTimeout(function(){gotoSpread(0)},200);
  }else gotoSpread(0);
}
function closeBook(){
  if(busy||cur()<0) return;
  if(mobile){Pg=-1;renderStatic();return}
  flip(S,-1);
}
function finish(){
  if(busy) return;
  busy=true;setState("end");
  setTimeout(function(){busy=false},reduced()?50:1300);
}
function restart(autoOpen){
  busy=false;
  S=-1;Pg=-1;
  setState("cover");renderStatic();
  if(autoOpen) setTimeout(openBook,reduced()?0:900);
}

/* ================= EVENTS ================= */
$("btnNext").addEventListener("click",next);
$("btnPrev").addEventListener("click",prev);
$("btnToc").addEventListener("click",function(){gotoSpread(0)});
$("btnClose").addEventListener("click",closeBook);
$("btnAgain").addEventListener("click",function(){restart(true)});
$("btnShut").addEventListener("click",function(){restart(false)});

function applyScale(){
  book.style.setProperty("--ts",tscale);
  renderStatic();
}
$("btnBig").addEventListener("click",function(){tscale=Math.min(1.3,Math.round((tscale+0.1)*10)/10);applyScale()});
$("btnSmall").addEventListener("click",function(){tscale=Math.max(1,Math.round((tscale-0.1)*10)/10);applyScale()});
$("btnMotion").addEventListener("click",function(){
  userRM=!userRM;this.setAttribute("aria-pressed",userRM);
  document.body.classList.toggle("rm",reduced());
});
document.body.classList.toggle("rm",reduced());
if(mqRM.addEventListener) mqRM.addEventListener("change",function(){document.body.classList.toggle("rm",reduced())});

/* clicking the book: cover opens it; on a spread, left page = next, right page = previous */
var down=null;
wrap.addEventListener("pointerdown",function(e){down={x:e.clientX,y:e.clientY}});
wrap.addEventListener("click",function(e){
  var t=e.target;
  var actBtn=t.closest&&t.closest("[data-act]");
  if(actBtn){if(actBtn.getAttribute("data-act")==="finish") finish();return}
  var tocBtn=t.closest&&t.closest(".toc button");
  if(tocBtn){gotoSpread(+tocBtn.getAttribute("data-s"));return}
  if(cur()<0){openBook();return}
  if(mobile) return;
  var sel=window.getSelection&&String(window.getSelection());
  if(sel) return;
  if(down&&(Math.abs(e.clientX-down.x)>6||Math.abs(e.clientY-down.y)>6)) return;
  var r=book.getBoundingClientRect();
  if(e.clientX<r.left+r.width/2) next(); else prev();
});
wrap.addEventListener("keydown",function(e){
  if(cur()<0&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openBook()}
});
document.addEventListener("keydown",function(e){
  if(document.body.className.indexOf("st-end")>=0) return;
  if(e.target&&e.target.tagName==="BUTTON"&&(e.key==="Enter"||e.key===" ")) return;
  if(e.key==="ArrowLeft"){e.preventDefault();next()}
  else if(e.key==="ArrowRight"){e.preventDefault();prev()}
  else if(e.key==="Home"&&cur()>=0){e.preventDefault();gotoSpread(0)}
  else if(e.key==="End"&&cur()>=0){e.preventDefault();gotoSpread(LAST)}
});

/* swipe: dragging toward the right turns to the next page (Arabic reading direction) */
var tx=null;
$("stage").addEventListener("touchstart",function(e){if(e.touches.length===1) tx={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
$("stage").addEventListener("touchend",function(e){
  if(!tx) return;
  var t=e.changedTouches[0],dx=t.clientX-tx.x,dy=t.clientY-tx.y;tx=null;
  if(Math.abs(dx)>55&&Math.abs(dy)<Math.abs(dx)*0.7){ if(dx>0) next(); else prev(); }
},{passive:true});

var rt;
window.addEventListener("resize",function(){clearTimeout(rt);rt=setTimeout(function(){if(busy) return;layout();renderStatic()},120)});

/* particles */
(function(){
  var box=$("particles");
  for(var i=0;i<30;i++){
    var e=document.createElement("i"),s=2+Math.random()*3.5;
    e.style.cssText="left:"+(Math.random()*100)+"%;top:"+(35+Math.random()*65)+"%;width:"+s+"px;height:"+s+"px;animation-duration:"+(13+Math.random()*14)+"s;animation-delay:"+(-Math.random()*20)+"s";
    box.appendChild(e);
  }
})();

/* start */
layout();renderStatic();
if(document.fonts&&document.fonts.ready){document.fonts.ready.then(function(){renderStatic()})}
})();
</script>
</body>
</html>
